<div class="tool-card">
  <h1>🖼️ PDF → JPG</h1>
  <input type="file" id="fileInput" accept="application/pdf">
  <button class="btn" onclick="convertPdf()">Convert Karein</button>
  <div id="pages" style="margin-top:16px;"></div>
</div>
<script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
async function convertPdf(){
  const file = document.getElementById('fileInput').files[0];
  if(!file){ alert('Pehle PDF select karein.'); return; }
  const pagesDiv = document.getElementById('pages');
  pagesDiv.innerHTML = 'Processing...';
  const bytes = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: bytes}).promise;
  pagesDiv.innerHTML = '';
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale: 2});
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({canvasContext: ctx, viewport: viewport}).promise;
    const imgUrl = canvas.toDataURL('image/jpeg', 0.9);
    const wrap = document.createElement('div');
    wrap.className = 'tool-card';
    wrap.innerHTML = `<p>Page ${i}</p><img src="${imgUrl}" style="max-width:100%;border-radius:8px;"><br>
      <button class="btn secondary" style="margin-top:8px;">Download Page ${i}</button>`;
    wrap.querySelector('button').onclick = () => bgDownloadDataUrl(imgUrl, `page-${i}.jpg`);
    pagesDiv.appendChild(wrap);
  }
}
</script>
