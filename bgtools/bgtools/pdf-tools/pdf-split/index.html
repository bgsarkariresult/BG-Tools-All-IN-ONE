<div class="tool-card">
  <h1>✂️ PDF Split</h1>
  <input type="file" id="fileInput" accept="application/pdf">
  <label>Page range (e.g. 1-3 ya 1,3,5)</label>
  <input type="text" id="range" placeholder="e.g. 1-3">
  <button class="btn" onclick="splitPdf()">Pages Extract Karein</button>
  <div class="result-box" id="result" style="display:none;">
    ✅ Ho gaya!<br>
    <button class="btn secondary" id="downloadBtn" style="margin-top:10px;">Download split.pdf</button>
  </div>
</div>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
function parseRange(rangeStr, maxPages){
  const indices = new Set();
  rangeStr.split(',').forEach(part => {
    part = part.trim();
    if(part.includes('-')){
      const [a,b] = part.split('-').map(n => parseInt(n));
      for(let i=a;i<=b;i++) if(i>=1 && i<=maxPages) indices.add(i-1);
    } else if(part) {
      const n = parseInt(part);
      if(n>=1 && n<=maxPages) indices.add(n-1);
    }
  });
  return [...indices];
}
async function splitPdf(){
  const file = document.getElementById('fileInput').files[0];
  const rangeStr = document.getElementById('range').value.trim();
  if(!file || !rangeStr){ alert('PDF select karein aur page range likhein.'); return; }
  const bytes = await file.arrayBuffer();
  const srcPdf = await PDFLib.PDFDocument.load(bytes);
  const indices = parseRange(rangeStr, srcPdf.getPageCount());
  if(indices.length === 0){ alert('Sahi page range likhein.'); return; }
  const newPdf = await PDFLib.PDFDocument.create();
  const pages = await newPdf.copyPages(srcPdf, indices);
  pages.forEach(p => newPdf.addPage(p));
  const newBytes = await newPdf.save();
  const blob = new Blob([newBytes], {type:'application/pdf'});
  document.getElementById('result').style.display = 'block';
  document.getElementById('downloadBtn').onclick = () => bgDownloadBlob(blob, 'split.pdf');
}
</script>
