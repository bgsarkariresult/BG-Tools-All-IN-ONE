---
layout: default
title: Case Converter
category: Text Tools
description: "Text ko UPPERCASE, lowercase, Title Case, Sentence case mein free convert karein."
keywords: case converter, uppercase lowercase converter online
---
<div class="tool-card">
  <h1>🔠 Case Converter</h1>
  <textarea id="inputText" rows="8" placeholder="Yahan text likhein..."></textarea>
  <div>
    <button class="btn" onclick="convert('upper')">UPPERCASE</button>
    <button class="btn" onclick="convert('lower')">lowercase</button>
    <button class="btn" onclick="convert('title')">Title Case</button>
    <button class="btn" onclick="convert('sentence')">Sentence case</button>
    <button class="btn secondary" onclick="bgCopyText(document.getElementById('inputText').value)">Copy</button>
  </div>
</div>
<script>
function convert(type){
  const el = document.getElementById('inputText');
  let t = el.value;
  if(type==='upper') t = t.toUpperCase();
  else if(type==='lower') t = t.toLowerCase();
  else if(type==='title') t = t.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
  else if(type==='sentence') t = t.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
  el.value = t;
}
</script>
