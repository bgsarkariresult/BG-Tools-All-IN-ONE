---
layout: default
title: GST Calculator
category: Calculator Tools
description: "Free GST Calculator - amount aur GST rate se GST add ya remove karke calculate karein."
keywords: gst calculator online free india
---
<div class="tool-card">
  <h1>🧾 GST Calculator</h1>
  <label>Amount (₹)</label>
  <input type="number" id="amount" placeholder="e.g. 1000">
  <label>GST Rate (%)</label>
  <select id="rate">
    <option value="5">5%</option>
    <option value="12">12%</option>
    <option value="18" selected>18%</option>
    <option value="28">28%</option>
  </select>
  <label>Type</label>
  <select id="type">
    <option value="add">GST Add Karein (Exclusive)</option>
    <option value="remove">GST Remove Karein (Inclusive)</option>
  </select>
  <button class="btn" onclick="calcGst()">Calculate</button>
  <div class="result-box" id="result"></div>
</div>
<script>
function calcGst(){
  const amount = parseFloat(document.getElementById('amount').value);
  const rate = parseFloat(document.getElementById('rate').value);
  const type = document.getElementById('type').value;
  const result = document.getElementById('result');
  if(isNaN(amount)){ result.textContent = 'Amount bharein.'; return; }
  if(type === 'add'){
    const gstAmount = (amount * rate) / 100;
    result.textContent = `Original Amount: ₹${amount.toFixed(2)}\nGST (${rate}%): ₹${gstAmount.toFixed(2)}\nTotal: ₹${(amount+gstAmount).toFixed(2)}`;
  } else {
    const original = (amount * 100) / (100 + rate);
    const gstAmount = amount - original;
    result.textContent = `Total Amount: ₹${amount.toFixed(2)}\nGST (${rate}%): ₹${gstAmount.toFixed(2)}\nOriginal Amount: ₹${original.toFixed(2)}`;
  }
}
</script>
