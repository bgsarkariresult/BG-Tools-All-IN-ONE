<div class="tool-card">
  <h1>🏦 EMI Calculator</h1>
  <label>Loan Amount (₹)</label>
  <input type="number" id="principal" placeholder="e.g. 500000">
  <label>Interest Rate (annual %)</label>
  <input type="number" id="rate" placeholder="e.g. 8.5">
  <label>Tenure (months)</label>
  <input type="number" id="tenure" placeholder="e.g. 60">
  <button class="btn" onclick="calcEmi()">EMI Calculate Karein</button>
  <div class="result-box" id="result"></div>
</div>
<script>
function calcEmi(){
  const P = parseFloat(document.getElementById('principal').value);
  const annualRate = parseFloat(document.getElementById('rate').value);
  const n = parseFloat(document.getElementById('tenure').value);
  const result = document.getElementById('result');
  if(isNaN(P) || isNaN(annualRate) || isNaN(n) || n <= 0){ result.textContent = 'Sahi values bharein.'; return; }
  const r = annualRate / 12 / 100;
  let emi;
  if(r === 0){ emi = P / n; }
  else { emi = (P * r * Math.pow(1+r, n)) / (Math.pow(1+r, n) - 1); }
  const totalPay = emi * n;
  const totalInterest = totalPay - P;
  result.textContent = `Monthly EMI: ₹${emi.toFixed(2)}\nTotal Payment: ₹${totalPay.toFixed(2)}\nTotal Interest: ₹${totalInterest.toFixed(2)}`;
}
</script>
