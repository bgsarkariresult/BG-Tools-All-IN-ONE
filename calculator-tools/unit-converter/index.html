---
layout: default
title: Unit Converter
category: Calculator Tools
description: "Free Unit Converter - length, weight aur temperature ek se doosre unit mein convert karein."
keywords: unit converter online free
---
<div class="tool-card">
  <h1>📏 Unit Converter</h1>
  <label>Category</label>
  <select id="category" onchange="fillUnits()">
    <option value="length">Length</option>
    <option value="weight">Weight</option>
    <option value="temperature">Temperature</option>
  </select>
  <div class="grid-2">
    <div>
      <label>From</label>
      <select id="fromUnit"></select>
    </div>
    <div>
      <label>To</label>
      <select id="toUnit"></select>
    </div>
  </div>
  <label>Value</label>
  <input type="number" id="value" placeholder="e.g. 100">
  <button class="btn" onclick="convertUnit()">Convert</button>
  <div class="result-box" id="result"></div>
</div>
<script>
const units = {
  length: { m:1, km:1000, cm:0.01, mm:0.001, mile:1609.34, yard:0.9144, foot:0.3048, inch:0.0254 },
  weight: { kg:1, g:0.001, mg:0.000001, ton:1000, pound:0.453592, ounce:0.0283495 },
  temperature: null
};
function fillUnits(){
  const cat = document.getElementById('category').value;
  const from = document.getElementById('fromUnit');
  const to = document.getElementById('toUnit');
  from.innerHTML = ''; to.innerHTML = '';
  const list = cat === 'temperature' ? ['celsius','fahrenheit','kelvin'] : Object.keys(units[cat]);
  list.forEach(u => {
    from.innerHTML += `<option value="${u}">${u}</option>`;
    to.innerHTML += `<option value="${u}">${u}</option>`;
  });
}
function convertUnit(){
  const cat = document.getElementById('category').value;
  const from = document.getElementById('fromUnit').value;
  const to = document.getElementById('toUnit').value;
  const val = parseFloat(document.getElementById('value').value);
  const result = document.getElementById('result');
  if(isNaN(val)){ result.textContent = 'Value bharein.'; return; }
  let ans;
  if(cat === 'temperature'){
    let celsius;
    if(from === 'celsius') celsius = val;
    else if(from === 'fahrenheit') celsius = (val - 32) * 5/9;
    else celsius = val - 273.15;
    if(to === 'celsius') ans = celsius;
    else if(to === 'fahrenheit') ans = (celsius * 9/5) + 32;
    else ans = celsius + 273.15;
  } else {
    const base = val * units[cat][from];
    ans = base / units[cat][to];
  }
  result.textContent = `${val} ${from} = ${ans.toFixed(4)} ${to}`;
}
fillUnits();
</script>
