<div class="tool-card">
  <h1>📐 Video Resizer</h1>
  <input type="file" id="fileInput" accept="video/*">
  <label>Resolution</label>
  <select id="res">
    <option value="1280:720">720p (1280x720)</option>
    <option value="854:480">480p (854x480)</option>
    <option value="640:360">360p (640x360)</option>
    <option value="1920:1080">1080p (1920x1080)</option>
  </select>
  <button class="btn" onclick="run()">Resize Karein</button>
  <div class="result-box" id="log">Ready...</div>
  <video id="preview" controls style="max-width:100%;margin-top:12px;display:none;"></video>
  <br><button class="btn secondary" id="downloadBtn" style="display:none;margin-top:10px;">Download</button>
</div>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script>
const { createFFmpeg, fetchFile } = FFmpeg;
const ffmpeg = createFFmpeg({ log: true, progress: p => { document.getElementById('log').textContent = 'Progress: ' + Math.round(p.ratio*100) + '%'; } });
async function run(){
  const file = document.getElementById('fileInput').files[0];
  const res = document.getElementById('res').value;
  if(!file){ alert('Pehle video select karein.'); return; }
  const log = document.getElementById('log');
  log.textContent = 'Loading engine...';
  if(!ffmpeg.isLoaded()) await ffmpeg.load();
  ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(file));
  log.textContent = 'Resizing...';
  await ffmpeg.run('-i', 'input.mp4', '-vf', `scale=${res}`, 'output.mp4');
  const data = ffmpeg.FS('readFile', 'output.mp4');
  const blob = new Blob([data.buffer], {type:'video/mp4'});
  const url = URL.createObjectURL(blob);
  document.getElementById('preview').src = url;
  document.getElementById('preview').style.display = 'block';
  const downloadBtn = document.getElementById('downloadBtn');
  downloadBtn.style.display = 'inline-block';
  downloadBtn.onclick = () => bgDownloadBlob(blob, 'resized.mp4');
  log.textContent = 'Ho gaya!';
}
</script>
