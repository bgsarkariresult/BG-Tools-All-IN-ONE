<div class="tool-card">
  <h1>🎞️ Video → GIF</h1>
  <input type="file" id="fileInput" accept="video/*">
  <div class="grid-2">
    <div>
      <label>Start Time (sec)</label>
      <input type="number" id="start" value="0">
    </div>
    <div>
      <label>Duration (sec, max 10 recommended)</label>
      <input type="number" id="duration" value="3">
    </div>
  </div>
  <button class="btn" onclick="run()">GIF Banayein</button>
  <div class="result-box" id="log">Ready...</div>
  <img id="preview" style="max-width:100%;margin-top:12px;display:none;border-radius:8px;">
  <br><button class="btn secondary" id="downloadBtn" style="display:none;margin-top:10px;">Download</button>
</div>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script>
const { createFFmpeg, fetchFile } = FFmpeg;
const ffmpeg = createFFmpeg({ log: true, progress: p => { document.getElementById('log').textContent = 'Progress: ' + Math.round(p.ratio*100) + '%'; } });
async function run(){
  const file = document.getElementById('fileInput').files[0];
  const start = document.getElementById('start').value;
  const duration = document.getElementById('duration').value;
  if(!file){ alert('Pehle video select karein.'); return; }
  const log = document.getElementById('log');
  log.textContent = 'Loading engine...';
  if(!ffmpeg.isLoaded()) await ffmpeg.load();
  ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(file));
  log.textContent = 'GIF bana rahe hain...';
  await ffmpeg.run('-ss', String(start), '-t', String(duration), '-i', 'input.mp4', '-vf', 'fps=10,scale=480:-1:flags=lanczos', 'output.gif');
  const data = ffmpeg.FS('readFile', 'output.gif');
  const blob = new Blob([data.buffer], {type:'image/gif'});
  const url = URL.createObjectURL(blob);
  document.getElementById('preview').src = url;
  document.getElementById('preview').style.display = 'block';
  const downloadBtn = document.getElementById('downloadBtn');
  downloadBtn.style.display = 'inline-block';
  downloadBtn.onclick = () => bgDownloadBlob(blob, 'video.gif');
  log.textContent = 'Ho gaya!';
}
</script>
