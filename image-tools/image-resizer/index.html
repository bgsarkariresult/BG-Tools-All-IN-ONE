<div class="tool-card">
  <h1>📐 Image Resizer</h1>
  <input type="file" id="fileInput" accept="image/*" onchange="loadImg()">
  <div class="grid-2">
    <div>
      <label>Width (px)</label>
      <input type="number" id="width" placeholder="e.g. 800">
    </div>
    <div>
      <label>Height (px)</label>
      <input type="number" id="height" placeholder="e.g. 600">
    </div>
  </div>
  <label><input type="checkbox" id="keepRatio" checked style="width:auto;"> Aspect ratio maintain karein</label>
  <button class="btn" onclick="resizeImage()">Resize Karein</button>
  <div class="result-box" id="result" style="display:none;">
    <img id="preview" style="max-width:100%;border-radius:8px;">
    <br><button class="btn secondary" id="downloadBtn" style="margin-top:10px;">Download</button>
  </div>
</div>
<script>
let origImg = null;
function loadImg(){
  const file = document.getElementById('fileInput').files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    origImg = new Image();
    origImg.onload = function(){
      document.getElementById('width').value = origImg.width;
      document.getElementById('height').value = origImg.height;
    };
    origImg.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('width').addEventListener('input', function(){
    if(document.getElementById('keepRatio').checked && origImg){
      document.getElementById('height').value = Math.round(this.value * origImg.height / origImg.width);
    }
  });
});
function resizeImage(){
  if(!origImg){ alert('Pehle image select karein.'); return; }
  const w = parseInt(document.getElementById('width').value);
  const h = parseInt(document.getElementById('height').value);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(origImg, 0, 0, w, h);
  canvas.toBlob(function(blob){
    const url = URL.createObjectURL(blob);
    document.getElementById('preview').src = url;
    document.getElementById('result').style.display = 'block';
    document.getElementById('downloadBtn').onclick = () => bgDownloadBlob(blob, 'resized.png');
  }, 'image/png');
}
</script>
