<div class="tool-card">
  <h1>🔄 JPG → PNG Converter</h1>
  <input type="file" id="fileInput" accept="image/jpeg">
  <button class="btn" onclick="convertImg('image/png','converted.png')">Convert to PNG</button>
  <div class="result-box" id="result" style="display:none;">
    <img id="preview" style="max-width:100%;border-radius:8px;">

  </div>

<script>
function convertImg(mime, filename){
  const file = document.getElementById('fileInput').files[0];
  if(!file){ alert('Pehle image select karein.'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      if(mime === 'image/jpeg'){ ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
      ctx.drawImage(img, 0, 0);
      canvas.toBlob(function(blob){
        const url = URL.createObjectURL(blob);
        document.getElementById('preview').src = url;
        document.getElementById('result').style.display = 'block';
        document.getElementById('downloadBtn').onclick = () => bgDownloadBlob(blob, filename);
      }, mime, 0.92);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
</script>
