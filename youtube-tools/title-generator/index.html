---
<div class="tool-card">
  <h1>🎬 YouTube Title Generator</h1>
  <input type="text" id="topic" placeholder="e.g. iPhone 17 Review">
  <button class="btn" onclick="generateTitles()">Titles Generate Karein</button>
  <div class="result-box" id="result"></div>
</div>
<script>
function generateTitles(){
  const topic = document.getElementById('topic').value.trim();
  const result = document.getElementById('result');
  if(!topic){ result.textContent = 'Pehle topic likhein.'; return; }
  const templates = [
    `${topic} - Sach Sach Bata Diya! 😱`,
    `${topic}: Ye Baat Koi Nahi Batata!`,
    `Top 5 Reasons Why ${topic} Is TRENDING in 2026`,
    `${topic} - Full Honest Review (Must Watch)`,
    `${topic} Kharidne Se Pehle Ye Video Dekh Lo!`,
    `${topic} - Beginners Guide 2026`,
    `Is ${topic} Worth It? Full Breakdown`,
    `${topic}: My Honest Experience`
  ];
  result.innerHTML = templates.map(t => `<div class="tag-pill" style="display:block;margin-bottom:6px;">${t}</div>`).join('');
}
</script>
