layout: default
title: YouTube Description Generator
category: YouTube Tools
description: "Free YouTube Description Generator - SEO friendly video description template banayein."
keywords: youtube description generator free

<div class="tool-card">
  <h1>📄 YouTube Description Generator</h1>
  <label>Video Topic</label>
  <input type="text" id="topic" placeholder="e.g. Best Budget Smartphones 2026">
  <label>Channel Name</label>
  <input type="text" id="channel" placeholder="e.g. BG Tech Reviews">
  <label>Social Media Link (optional)</label>
  <input type="text" id="social" placeholder="e.g. https://instagram.com/yourpage">
  <button class="btn" onclick="generateDesc()">Description Generate Karein</button>
  <textarea id="result" rows="12" readonly></textarea>
  <button class="btn secondary" onclick="bgCopyText(document.getElementById('result').value)">Copy</button>
</div>
<script>
function generateDesc(){
  const topic = document.getElementById('topic').value.trim() || 'is video';
  const channel = document.getElementById('channel').value.trim() || 'hamare channel';
  const social = document.getElementById('social').value.trim();
  const desc =
`Is video mein hum baat karenge ${topic} ke baare mein. Agar aapko video pasand aaye to LIKE zaroor karein, apne dosto ke saath SHARE karein aur ${channel} ko SUBSCRIBE karna na bhoolein!

🔔 Naye videos ke liye bell icon dabayein.
👍 Video pasand aaye to like karein.
💬 Apne suggestions comment mein batayein.

${social ? '📱 Social Media: ' + social : ''}

#${topic.replace(/\s+/g,'')} #youtube #trending

Thanks for watching! ❤️`;
  document.getElementById('result').value = desc;
}
</script>
