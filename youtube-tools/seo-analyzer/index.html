---
layout: default
title: YouTube SEO Analyzer
category: YouTube Tools
description: "Free YouTube SEO Analyzer - title aur description ka basic SEO score check karein."
keywords: youtube seo analyzer free, youtube seo checker
---
<div class="tool-card">
  <h1>📊 YouTube SEO Analyzer</h1>
  <label>Video Title</label>
  <input type="text" id="title" placeholder="Apna video title yahan likhein">
  <label>Video Description</label>
  <textarea id="desc" rows="6" placeholder="Apna video description yahan likhein"></textarea>
  <button class="btn" onclick="analyze()">SEO Check Karein</button>
  <div class="result-box" id="result"></div>
</div>
<script>
function analyze(){
  const title = document.getElementById('title').value.trim();
  const desc = document.getElementById('desc').value.trim();
  const result = document.getElementById('result');
  let score = 0;
  let tips = [];

  if(title.length >= 40 && title.length <= 70){ score += 25; } else { tips.push('Title ki length 40-70 characters ke beech rakhein (abhi: ' + title.length + ').'); }
  if(/[0-9]/.test(title)){ score += 10; } else { tips.push('Title mein number use karein (jaise Top 5, 2026) - CTR badhta hai.'); }
  if(desc.length >= 200){ score += 25; } else { tips.push('Description kam se kam 200 characters ka rakhein (abhi: ' + desc.length + ').'); }
  if(desc.includes('#')){ score += 15; } else { tips.push('Description mein 2-3 hashtags add karein.'); }
  if(title && desc.toLowerCase().includes(title.toLowerCase().split(' ')[0])){ score += 25; } else { tips.push('Description mein title ka main keyword repeat karein.'); }

  result.innerHTML = `<b>SEO Score: ${score}/100</b><br><br>` +
    (tips.length ? '<b>Sujhaav:</b><br>' + tips.map(t => '• ' + t).join('<br>') : '✅ Bahut badhiya! Koi major issue nahi mila.');
}
</script>
